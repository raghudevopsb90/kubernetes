## kubectl auth can-i list pods --as=system:serviceaccount:roboshop:pod-reader -n roboshop
apiVersion: v1
kind: Namespace
metadata:
  name: roboshop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: roboshop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: roboshop
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: roboshop
subjects:
- kind: ServiceAccount
  name: pod-reader
  namespace: roboshop
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: kubectl
  namespace: roboshop
spec:
  serviceAccountName: pod-reader
  containers:
  - name: kubectl
    image: alpine/kubectl:1.35.0
    command: ["sleep", "infinity"]
