apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
data:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  index.html: |
    <h1>RoboShop page from a ConfigMap</h1>
---
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
spec:
  containers:
  - name: nginx
    image: nginx:1.29
    envFrom:
    - configMapRef:
        name: catalogue
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html
  volumes:
  - name: html
    configMap:
      name: catalogue
      items:
      - key: index.html
        path: index.html
