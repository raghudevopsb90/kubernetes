## kubectl create secret generic catalogue --from-literal=MYSQL_PASSWORD=RoboShop@1 --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: catalogue
type: Opaque
stringData:
  MYSQL_USER: roboshop
  MYSQL_PASSWORD: RoboShop@1
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
  - name: app
    image: docker.io/redhat/ubi10
    command: ["sleep", "infinity"]
    env:
    - name: MYSQL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: catalogue
          key: MYSQL_PASSWORD
    volumeMounts:
    - name: creds
      mountPath: /etc/creds
      readOnly: true
  volumes:
  - name: creds
    secret:
      secretName: catalogue
