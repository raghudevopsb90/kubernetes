apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
        command: ["sh", "-c", "printf 'server { listen 8081; location /stub_status { stub_status; } }' > /etc/nginx/conf.d/status.conf && exec nginx -g 'daemon off;'"]
      - name: exporter
        image: nginx/nginx-prometheus-exporter:1.4
        args: ["--nginx.scrape-uri=http://localhost:8081/stub_status"]
        ports:
        - name: metrics
          containerPort: 9113
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
  - name: metrics
    port: 9113
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  endpoints:
  - port: metrics
    interval: 15s
