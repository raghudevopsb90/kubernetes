---
apiVersion: v1
kind: Pod
metadata:
  name: catalogue-1
  labels:
    app: frontend
spec:
  containers:
  - name: nginx
    image: nginx:1.29
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.29

