## helm repo add istio https://istio-release.storage.googleapis.com/charts
## helm install istio-base istio/base -n istio-system --create-namespace --version 1.30.8 --wait
## helm install istiod istio/istiod -n istio-system --version 1.30.8 --wait
## apply this file after istiod is running, so the sidecars get injected
## kubectl exec -n mesh client -- sh -c 'for i in $(seq 1 10); do curl -s catalogue; done'
apiVersion: v1
kind: Namespace
metadata:
  name: mesh
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-v1
  namespace: mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue
      version: v1
  template:
    metadata:
      labels:
        app: catalogue
        version: v1
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:1.0
        args: ["-text=catalogue v1", "-listen=:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-v2
  namespace: mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue
      version: v2
  template:
    metadata:
      labels:
        app: catalogue
        version: v2
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:1.0
        args: ["-text=catalogue v2", "-listen=:8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: mesh
spec:
  selector:
    app: catalogue
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: catalogue
  namespace: mesh
spec:
  host: catalogue
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalogue
  namespace: mesh
spec:
  hosts:
  - catalogue
  http:
  - route:
    - destination:
        host: catalogue
        subset: v1
      weight: 80
    - destination:
        host: catalogue
        subset: v2
      weight: 20
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: mesh
spec:
  mtls:
    mode: STRICT
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: mesh
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.17.0
    command: ["sleep", "infinity"]
