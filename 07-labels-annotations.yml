apiVersion: v1
kind: Pod
metadata:
  name: frontend
  labels:
    app: roboshop
    component: frontend
    env: dev
#   annotations:
#     kubernetes.io/pod/owner: raghu
#     kubernetes.io/pod/description: "RoboShop web page served by nginx"
