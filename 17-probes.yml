apiVersion: v1
kind: Pod
metadata:
  name: probes-demo
  labels:
    app: probes-demo
spec:
  containers:
  - name: nginx
    image: nginx:1.29
    startupProbe:
      httpGet:
        path: /
        port: 80
      failureThreshold: 30
      periodSeconds: 2
    readinessProbe:
      httpGet:
        path: /
        port: 80
      periodSeconds: 5
    livenessProbe:
      tcpSocket:
        port: 80
      periodSeconds: 10
      failureThreshold: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: probes-broken
spec:
  containers:
  - name: nginx
    image: nginx:1.29
    livenessProbe:
      httpGet:
        path: /health
        port: 80
      periodSeconds: 5
      failureThreshold: 2
