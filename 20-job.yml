apiVersion: batch/v1
kind: Job
metadata:
  name: schema-load
spec:
  completions: 3
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: load
        image: busybox:1.37
        command: ["sh", "-c", "echo loading schema on $(hostname); sleep 5"]
