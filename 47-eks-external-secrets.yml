## needs external-secrets (make addons in 44-eks-cluster) and the parameter from 46-eks-pod-identity.yml
## kubectl get externalsecret catalogue   ->  STATUS SecretSynced
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalogue
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: parameter-store
  target:
    name: catalogue
  data:
  - secretKey: MYSQL_PASSWORD
    remoteRef:
      key: /roboshop/dev/catalogue/MYSQL_PASSWORD
---
apiVersion: v1
kind: Pod
metadata:
  name: catalogue
spec:
  containers:
  - name: app
    image: docker.io/redhat/ubi10
    command: ["sleep", "infinity"]
    envFrom:
    - secretRef:
        name: catalogue
