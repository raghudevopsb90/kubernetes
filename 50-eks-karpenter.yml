## needs Karpenter (make addons in 44-eks-cluster)
## kubectl scale deployment inflate --replicas=5   ->  watch: kubectl get nodeclaims,nodes -w
## kubectl scale deployment inflate --replicas=0   ->  Karpenter removes the empty node after 1 minute
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: learn-eks-node
  amiSelectorTerms:
  - alias: al2023@latest
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: learn-eks
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: learn-eks
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["spot", "on-demand"]
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values: ["c", "m", "t"]
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      expireAfter: 24h
  limits:
    cpu: "16"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inflate
  template:
    metadata:
      labels:
        app: inflate
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: "1"
