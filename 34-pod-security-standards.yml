apiVersion: v1
kind: Namespace
metadata:
  name: restricted
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Pod
metadata:
  name: plain-nginx
  namespace: restricted
spec:
  containers:
  - name: nginx
    image: nginx:1.29
---
apiVersion: v1
kind: Pod
metadata:
  name: secure-nginx
  namespace: restricted
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: nginx
    image: nginxinc/nginx-unprivileged:1.29
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
