apiVersion: v1
kind: Pod
metadata:
  name: env-demo
spec:
  containers:
  - name: app
    image: docker.io/redhat/ubi10
    command: ["sleep", "infinity"]
    env:
    - name: MYSQL_HOST
      value: mysql
    - name: MYSQL_PORT
      value: "3306"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
