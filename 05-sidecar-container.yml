apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
spec:
  initContainers:
  - name: log-shipper
    image: busybox:1.37
    restartPolicy: Always
    command: ["sh", "-c", "touch /var/log/nginx/access.log; tail -F /var/log/nginx/access.log"]
  containers:
  - name: nginx
    image: nginx:1.29
    command: ["nginx", "-g", "daemon off; error_log /dev/stderr;"]
