## kubectl set image deployment/frontend nginx=nginx:1.29
## kubectl rollout status deployment/frontend
## kubectl rollout undo deployment/frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
