## kubectl taint node learn-worker2 apps=roboshop:NoSchedule
## kubectl taint node learn-worker2 apps=roboshop:NoSchedule-   (to remove)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-toleration
spec:
  replicas: 4
  selector:
    matchLabels:
      app: no-toleration
  template:
    metadata:
      labels:
        app: no-toleration
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: with-toleration
spec:
  replicas: 4
  selector:
    matchLabels:
      app: with-toleration
  template:
    metadata:
      labels:
        app: with-toleration
    spec:
      tolerations:
      - key: apps
        operator: Equal
        value: roboshop
        effect: NoSchedule
      containers:
      - name: nginx
        image: nginx:1.29
